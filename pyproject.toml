[project]
name = "alphaduel"
version = "0.1.0"
description = "Benchmarking quantitative RL agents vs LLM agents on a shared, realistic trading environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AlphaDuel" }]
keywords = ["reinforcement-learning", "llm", "trading", "gymnasium", "quant", "finance"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "gymnasium>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "mlflow>=2.14",
    "typer>=0.12",
    "rich>=13.7",
    "yfinance>=0.2.40",
    "fredapi>=0.5.2",
    "jinja2>=3.1.6",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "tensorboard>=2.16",
]
llm = [
    # Vanilla off-the-shelf agents (ChatOllama / ChatOpenAI / ChatAnthropic / ChatReplicate + LangGraph).
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-core>=1.5.3",
    "langgraph>=1.2.10",
    # Sourced from GitHub via [tool.uv.sources] (not on PyPI yet).
    "langchain-replicate",
]
llm-train = [
    # Optional P3 fine-tuning stack (SFT / GRPO). Not required for the dashboard.
    #"transformers>=4.42",
    #"openai>=1.35",
    #"trl>=0.9",
    #"peft>=0.11",
    #"accelerate>=0.31",
    #"torch>=2.2",
]
generative = [
    #"torch>=2.2",
]
dashboard = [
    "streamlit>=1.36",
    "plotly>=5.22",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.2",
    "ipywidgets>=8.1.8",
]

[project.scripts]
alphaduel = "alphaduel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphaduel"]

# langchain-replicate is published on GitHub only for now:
# https://github.com/replicate/replicate-langchain
[tool.uv.sources]
langchain-replicate = { git = "https://github.com/replicate/replicate-langchain.git" }


[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
