[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alphaduel"
version = "0.0.1"
description = "A controlled duel between reasoning LLM agents and pure quant models for portfolio allocation."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Aurel Avomo", email = "avomoa@gmail.com" }]
keywords = ["reinforcement-learning", "llm", "finance", "portfolio", "gymnasium", "quant"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "gymnasium>=0.29",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "jinja2>=3.1",
  "langchain-ollama>=1.1.0",
  "langgraph>=1.2.9",
  "pyarrow>=24.0.0",
  "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/aurelSteve77/alphaduel"

# CLI scripts
[project.scripts]
alphaduel = "alphaduel.cli:main"
alphaduel-baselines = "alphaduel.cli:baselines_main"
alphaduel-dashboard = "alphaduel.dashboard.launch:main"


[project.optional-dependencies]
# ============================================================================
# CORE COMPONENTS
# ============================================================================

# DEV
dev = ["jupyterlab>=4.6.1", "ipywidgets>=8.1.8", "pytest>=8.0"]

# UI
dashboard = ["streamlit>=1.59.2"]

# Data
data = [
    "pandas-datareader>=0.11.1",
    "yfinance>=1.5.2",
    "requests>=2.31",
    "pyarrow>=15.0",
]


[tool.hatch.build.targets.wheel]
packages = ["alphaduel"]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
