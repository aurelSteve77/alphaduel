# Vanilla off-the-shelf LLM agent (chat model injected via LLMHandler).
# Requires: uv sync --extra llm
#   - ollama:    local daemon + pulled model
#   - openai:    OPENAI_API_KEY in .env
#   - replicate: REPLICATE_API_TOKEN in .env (https://replicate.com/account)
agents:
  - name: llm_vanilla
    kind: llm
    params:
      # Built by alphaduel.agents.llm.resolve_llm / LLMHandler.create
      llm:
        provider: ollama          # ollama | openai | replicate
        model: "qwen3.5:2b"       # openai e.g. gpt-5.4-mini; replicate e.g. meta/meta-llama-3-8b-instruct
        temperature: 0.0
        reasoning: false          # ollama-only
        reasoning_effort: low     # openai-only (default low); omit / null to disable
      use_memory: false
      max_memory_turns: 8
      system_prompt_key: base_agent_system
      user_prompt_key: base_agent_user
      # symbols: null  # defaults to env info["symbols"] (or real ticker for single-asset)
      allow_short: false
