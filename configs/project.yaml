# Default configuration for the alphaduel study.
# Every branch (LLM + quant) reads this same file to guarantee parity.

seed: 77

# Default Gymnasium trading-env knobs (CLI / code overrides win).
env:
  start: "2020-01-01"
  end: "2025-12-31"
  # When omitted, falls back to data.tickers.
  # tickers: []
  initial_cash: 10000.0
  transaction_fee: 0.001          # 10 bps of notional traded
  n_days: 60                     # max trading days per episode
  max_shares: 10                  # max buy/sell shares per ticker per day
  allow_short: false
  include_news: false
  reward_scale: 1.0
  features:
    - close
    - pct_change_1d
    - pct_change_5d
    - rsi_14
    - volatility_20d
    - sma_ratio_20d

# LLM policy (Ollama via langchain-ollama).
llm:
  model: "qwen3.5:2b"
  temperature: 0.0
  reasoning: false
  # base_url: "http://127.0.0.1:11434"
  prompt_group: llm_policy
  max_history: 10                 # prior user/ai turn pairs (null = unlimited)

data:
  # Universe and date range shared by every branch. CLI args override these.
  # 25 US + 25 EU large-caps (EU symbols use Yahoo Finance exchange suffixes).
  tickers:
    # --- US (25) ---
    - AAPL   # Apple
    - MSFT   # Microsoft
    - GOOGL  # Alphabet
    - AMZN   # Amazon
    - META   # Meta
    - NVDA   # NVIDIA
    - TSLA   # Tesla
    - BRK-B  # Berkshire Hathaway
    - JPM    # JPMorgan Chase
    - V      # Visa
    - UNH    # UnitedHealth
    - XOM    # Exxon Mobil
    - JNJ    # Johnson & Johnson
    - WMT    # Walmart
    - PG     # Procter & Gamble
    - MA     # Mastercard
    - HD     # Home Depot
    - CVX    # Chevron
    - ABBV   # AbbVie
    - MRK    # Merck
    - COST   # Costco
    - PEP    # PepsiCo
    - KO     # Coca-Cola
    - AVGO   # Broadcom
    - NFLX   # Netflix
    # --- EU (25) ---
  start: "2000-01-01"
  end: "2026-07-30"

  market:
    cache_dir: data/raw/market

  # Textual (news / filings) data aligned point-in-time to each trading date.
  news:
    cache_dir: data/raw/news
    finnhub:
      # API key is read from this environment variable (never commit secrets).
      api_key_env: FINNHUB_API_KEY
    edgar:
      # SEC requires a descriptive User-Agent with a contact address.
      user_agent: "alphaduel research (avomoa@gmail.com)"
      forms: ["8-K", "10-Q", "10-K"]

  # Merged market + news panel produced by alphaduel.data.dataset.
  merged:
    cache_dir: data/processed

logging:
  level: INFO
  format: "%(asctime)s | %(levelname)-8s | %(name)s | %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  to_stdout: true
  to_file: true
  log_dir: logs
  filename: alphaduel.log
  # Size-based rotation (active when enabled).
  rotation:
    enabled: true
    max_bytes: 10485760  # 10 MiB
    backup_count: 5
  # Time-based rotation (optional second file handler).
  timed_rotation:
    enabled: false
    filename: alphaduel.timed.log
    when: midnight
    interval: 1
    backup_count: 14
